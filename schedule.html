<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew Schedule</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<!-- Navbar -->
<div id="navbar-placeholder"></div>

<div class="main-content">
    <h1 style="color: #00C7B2; margin: 0 0 20px 0;">Crew Schedule</h1>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="calendar">📅 Calendar</button>
        <button class="tab-btn" data-tab="spreadsheet">📊 Spreadsheet</button>
        <button class="tab-btn" data-tab="memberchart">📈 Member Charts</button>
        <button class="tab-btn" data-tab="crewoverview">📋 Crew Overview</button>
    </div>

    <!-- CALENDAR TAB (Main Default) -->
    <div id="calendar-tab" class="tab-content active">
        <div class="calendar-container">
            <div class="calendar-header">
                <button id="prevMonth" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <div id="monthYear" class="month-year"></div>
                <button id="nextMonth" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
                <button id="todayBtn" class="today-btn">Today</button>
                <button id="autoPopulateBtn" class="action-btn">🔄 Auto Populate</button>
                <button id="clearMonthBtn" class="action-btn danger">🗑️ Clear Month</button>
            </div>
            <div class="weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
                <div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <!-- Day Details -->
        <div id="dayDetails" class="day-details">
            <button id="closeDetails" class="close-btn">✕</button>
            <h3 id="selectedDate"></h3>

            <div class="add-shift-form">
                <h4>Add Shift</h4>
                <select id="shiftMember" style="width:100%; padding:12px; margin:8px 0;"></select>
                <select id="shiftStatus" style="width:100%; padding:12px; margin:8px 0;">
                    <option value="working">Working</option>
                    <option value="vacation">OFF (Vacation)</option>
                </select>
                <div id="singleAreaGroup">
                    <select id="shiftArea" style="width:100%; padding:12px; margin:8px 0;"></select>
                </div>
                <button onclick="addShift()" class="save-btn" style="width:100%; margin-top:12px;">Add to Schedule</button>
            </div>

            <h4>Shifts for this day</h4>
            <div id="scheduleList" class="schedule-list"></div>
        </div>
    </div>

    <!-- SPREADSHEET TAB -->
    <div id="spreadsheet-tab" class="tab-content">
        <div class="card">
            <h3>📊 Full Month Spreadsheet</h3>
            
            <!-- Month Navigation (same style as calendar) -->
            <div class="calendar-header" style="margin-bottom: 20px; justify-content: flex-start; gap: 12px;">
                <button id="spreadsheetPrevMonth" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <div id="spreadsheetMonthYear" class="month-year" style="min-width: 180px; text-align: center;"></div>
                <button id="spreadsheetNextMonth" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
                <button id="spreadsheetTodayBtn" class="today-btn">Today</button>
                <button onclick="printSchedule()" class="action-btn" style="margin-left: auto; background:#3b82f6; color:white;">
                🖨️ Print Schedule
            </button>
                <button onclick="renderSpreadsheet()" class="action-btn" style="margin-left: auto;">🔄 Refresh Grid</button>
            </div>

            <div id="spreadsheetContainer"></div>
        </div>
    </div>

    <!-- MEMBER CHARTS TAB -->
    <div id="memberchart-tab" class="tab-content">
        <div class="card">
            <h3>Member Shift Breakdown</h3>
            <select id="memberChartSelect" class="dancing-select" style="margin-bottom:20px; width:100%;"></select>
            <div style="height: 420px;">
                <canvas id="memberShiftChart"></canvas>
            </div>
        </div>
    </div>

    <!-- CREW OVERVIEW TAB -->
    <div id="crewoverview-tab" class="tab-content">
        <div class="card">
            <h3>Crew Shift Data</h3>
            <div id="memberBreakdownContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px;"></div>
        </div>
    </div>
</div>
<!-- BULK MODAL WITH TABS -->
<div id="bulkShiftModal" class="modal">
    <div class="modal-content bulk-modal">
        <div class="modal-header">
            <h2>Bulk Actions — Selected Days</h2>
            <button class="close-btn" onclick="hideBulkShiftModal()">✕</button>
        </div>

        <!-- Tabs -->
        <div class="bulk-tabs">
            <button class="bulk-tab-btn active" onclick="switchBulkTab(0)">Crew Assignment</button>
            <button class="bulk-tab-btn" onclick="switchBulkTab(1)">Book Time Off</button>
        </div>

        <!-- Tab Content -->
        <div id="bulkTabContent" class="modal-body">
            <!-- Crew Assignment Tab (default) -->
            <div id="crewTab" class="bulk-tab-panel">
                <p id="bulkDaysInfo" class="bulk-days-info"></p>
                <div id="areaAssignmentsContainer" class="area-assignments-container"></div>
            </div>

            <!-- Time Off Tab -->
            <div id="offTab" class="bulk-tab-panel" style="display:none;">
                <p id="offDaysInfo" class="bulk-days-info"></p>
                <p style="margin-bottom:12px; color:#94a3b8;">Select members to mark as OFF:</p>
                <div id="offMembersContainer" style="max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>

        <div class="form-actions">
            <button onclick="hideBulkShiftModal()" class="cancel-btn">Cancel</button>
            <button onclick="applyBulkAction()" class="save-btn">✅ Apply to All Selected Days</button>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
